<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaQuest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Nunito', 'system-ui', 'sans-serif'] },
          colors: {
            accent: '#4F46E5', 'accent-dark': '#3730A3',
            success: '#10B981', 'success-dark': '#047857',
            error: '#EF4444', 'error-dark': '#B91C1C',
            gold: '#FBBF24', bg: '#F8FAFC',
          },
          boxShadow: {
            'premium': '0 10px 40px -10px rgba(0,0,0,0.08)',
            'inner-light': 'inset 0 2px 4px 0 rgba(255, 255, 255, 0.3)',
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Nunito', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    /* Animasi Kuis */
    @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    .animate-pop { animation: pop 0.3s ease-in-out; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; }
    
    /* Tombol 3D */
    .btn-3d { transition: all 0.1s ease; border-bottom-width: 4px; }
    .btn-3d:active { transform: translateY(4px); border-bottom-width: 0px; margin-bottom: 4px; }

    /* Animasi Maskot */
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    .mascot-idle { animation: float 3s ease-in-out infinite; }
    
    @keyframes shake { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }
    .mascot-fail { animation: shake 0.4s ease-in-out; }
    
    @keyframes jump { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-25px) scale(1.1); } }
    .mascot-success { animation: jump 0.6s ease-out; }
    
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .mascot-thinking { animation: spin 2s linear infinite; }

    /* Custom Scrollbar buat Medali */
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-bg text-slate-800 antialiased">
  <div id="app" class="min-h-screen flex flex-col"></div>

  <script src="storage.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
