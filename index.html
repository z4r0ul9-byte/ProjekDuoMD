<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaQuest</title>
  <!-- Load React & Tailwind via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Setup warna custom Tailwind
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: '#4d6bfe',
            'accent-soft': '#eef1ff',
            ink: '#0d0d0d',
            'ink-muted': '#6b7280',
            surface: '#ffffff',
            'surface-alt': '#fafafa',
            border: '#e5e5e5',
          }
        }
      }
    }
  </script>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #fafafa;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .lq-fade-in { animation: fadeIn 220ms ease-out both; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;
    
    // Icon Sparkles sederhana
    const Sparkles = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
        <path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/>
      </svg>
    );

    function App() {
      return (
        <div className="min-h-screen flex items-center justify-center p-6">
          <div className="lq-fade-in max-w-md w-full text-center bg-surface rounded-2xl border border-border shadow-sm p-8">
            <div className="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-accent-soft text-accent mb-5">
              <Sparkles size={26} />
            </div>
            <h1 className="text-3xl font-bold text-ink mb-1">
              LinguaQuest
            </h1>
            <p className="text-sm text-ink-muted mb-6">
              Belajar bahasa, gaya kamu sendiri.
            </p>

            <div className="text-left bg-surface-alt rounded-xl p-4 text-sm space-y-1.5 border border-border">
              <p className="font-medium text-ink">
                Phase 1 · Foundation
              </p>
              <p className="text-ink-muted">✓ Single-File HTML (No build step)</p>
              <p className="text-ink-muted">✓ React + Tailwind via CDN</p>
              <p className="text-ink-muted">⏳ Gemini + UI menyusul di Phase 2</p>
            </div>

            <p className="mt-6 text-xs text-ink-muted">
              Kalau halaman ini kebuka di GitHub Pages, deploy kamu sudah benar.
            </p>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
