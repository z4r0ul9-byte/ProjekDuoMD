<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaQuest</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: '#4d6bfe',
            'accent-soft': '#eef1ff',
            ink: '#0d0d0d',
            'ink-muted': '#6b7280',
            surface: '#ffffff',
            'surface-alt': '#fafafa',
            border: '#e5e5e5',
            success: '#22c55e',
            error: '#ef4444',
          }
        }
      }
    }
  </script>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background-color: #fafafa; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .lq-fade-in { animation: fadeIn 220ms ease-out both; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- STORAGE ---
    const DEFAULT_SETTINGS = {
      apiKey: '', targetLanguage: 'English', stylePreset: 'santuy', customStylePrompt: '', level: 'beginner',
    };

    const loadSettings = () => {
      try {
        const raw = localStorage.getItem('linguaquest.settings');
        return raw ? { ...DEFAULT_SETTINGS, ...JSON.parse(raw) } : DEFAULT_SETTINGS;
      } catch { return DEFAULT_SETTINGS; }
    };
    const saveSettings = (settings) => localStorage.setItem('linguaquest.settings', JSON.stringify(settings));

    // --- ICONS ---
    const Sparkles = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
      </svg>
    );
    const SpeakerIcon = () => (
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      </svg>
    );

    // --- PROMPT GENERATOR ---
    const getStyleText = (settings) => {
      if (settings.stylePreset === 'gaul') return 'Gunakan bahasa gaul Jakarta yang santai, banyak slang (kayak, gue, lo, wkwk).';
      if (settings.stylePreset === 'formal') return 'Gunakan bahasa Indonesia formal, baku, dan sopan.';
      if (settings.stylePreset === 'storyteller') return 'Gunakan gaya bercerita yang menarik dan imajinatif.';
      if (settings.stylePreset === 'custom') return settings.customStylePrompt || 'Gunakan bahasa yang santai dan mudah dimengerti.';
      return 'Gunakan bahasa Indonesia sehari-hari yang santuy dan asik.';
    };

    const generatePrompt = (settings) => {
      return `Kamu adalah guru bahasa ${settings.targetLanguage} untuk orang Indonesia.
Buatkan 5 soal latihan untuk level ${settings.level}. Wajib campur dari 4 tipe ini:
1. "grammar" (pilihan ganda, isi field "options" array 4 string)
2. "translate" (terjemahkan kalimat)
3. "fill-blank" (isi titik-titik, soal ada di field "question")
4. "listening" (pilihan ganda, isi field "audioText" dengan teks yang akan dibacakan TTS, dan "options")

Gaya bahasa kamu saat memberikan penjelasan harus: ${getStyleText(settings)}.

Output HARUS berupa JSON array murni tanpa markdown, dengan format persis seperti ini:
[
  {
    "type": "grammar",
    "question": "Which one is correct?",
    "options": ["He go to school", "He goes to school", "He going to school", "He gone to school"],
    "correctAnswer": "He goes to school",
    "explanation": "Penjelasan singkat..."
  },
  {
    "type": "translate",
    "question": "Saya suka makan apel",
    "prompt": "Translate to ${settings.targetLanguage}",
    "correctAnswer": "I like eating apples",
    "explanation": "Penjelasan..."
  },
  {
    "type": "fill-blank",
    "question": "I ___ a student",
    "prompt": "Isi dengan kata yang tepat",
    "correctAnswer": "am",
    "explanation": "Penjelasan..."
  },
  {
    "type": "listening",
    "audioText": "Hello, how are you?",
    "options": ["Hello, how are you?", "Good morning", "Thank you", "See you later"],
    "correctAnswer": "Hello, how are you?",
    "explanation": "Penjelasan..."
  }
]`;
    };

    // --- GEMINI API FETCH ---
    const FALLBACK_MODELS = ['gemini-3.6-flash', 'gemini-3.1-flash-lite', 'gemini-3.8-flash'];
    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    const fetchWithFallback = async (prompt, apiKey) => {
      let lastError = null;
      for (const model of FALLBACK_MODELS) {
        for (let attempt = 1; attempt <= 2; attempt++) {
          try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ role: "user", parts: [{ text: prompt }] }],
                generationConfig: { responseMimeType: "application/json" }
              })
            });
            if (res.ok) {
              const json = await res.json();
              return JSON.parse(json.candidates[0].content.parts[0].text);
            }
            const errData = await res.json();
            if (res.status === 503 || res.status === 429) {
              lastError = new Error(`Model ${model} sibuk.`);
              await sleep(attempt * 2000); continue;
            }
            throw new Error(errData.error?.message || "Gagal");
          } catch (err) {
            lastError = err;
            if (attempt === 2) break;
            await sleep(1000);
          }
        }
      }
      throw new Error(`Semua server sibuk: ${lastError?.message}`);
    };

    // --- COMPONENTS ---
    function Onboarding({ onSave }) {
      const [form, setForm] = useState(loadSettings());
      const handleSubmit = (e) => { e.preventDefault(); saveSettings(form); onSave(); };

      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="lq-fade-in max-w-md w-full bg-surface rounded-2xl border border-border shadow-sm p-6">
            <div className="text-center mb-6">
              <div className="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-accent-soft text-accent mb-3"><Sparkles size={24} /></div>
              <h1 className="text-2xl font-bold text-ink">Pengaturan</h1>
            </div>
            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-sm font-medium text-ink mb-1">Gemini API Key</label>
                <input type="password" required value={form.apiKey} onChange={e => setForm({...form, apiKey: e.target.value})} className="w-full px-3 py-2 border border-border rounded-lg text-sm focus:ring-2 focus:ring-accent" />
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-sm font-medium text-ink mb-1">Bahasa</label>
                  <select value={form.targetLanguage} onChange={e => setForm({...form, targetLanguage: e.target.value})} className="w-full px-3 py-2 border border-border rounded-lg text-sm">
                    <option>English</option><option>Japanese</option><option>Korean</option><option>Arabic</option><option>Spanish</option>
                  </select>
                </div>
                <div>
                  <label className="block text-sm font-medium text-ink mb-1">Gaya</label>
                  <select value={form.stylePreset} onChange={e => setForm({...form, stylePreset: e.target.value})} className="w-full px-3 py-2 border border-border rounded-lg text-sm">
                    <option value="santuy">Santuy</option><option value="gaul">Gaul</option><option value="formal">Formal</option><option value="custom">Custom</option>
                  </select>
                </div>
              </div>
              {form.stylePreset === 'custom' && (
                <input type="text" placeholder="Gaya custom..." value={form.customStylePrompt} onChange={e => setForm({...form, customStylePrompt: e.target.value})} className="w-full px-3 py-2 border border-border rounded-lg text-sm" />
              )}
              <button type="submit" className="w-full bg-accent text-white font-medium py-2.5 rounded-lg mt-2">Simpan</button>
            </form>
          </div>
        </div>
      );
    }

    function Home({ onStart, onSettings, settings }) {
      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="lq-fade-in max-w-md w-full bg-surface rounded-2xl border border-border shadow-sm p-8 text-center">
            <h1 className="text-2xl font-bold text-ink mb-2">Siap Belajar?</h1>
            <p className="text-ink-muted mb-6 text-sm">{settings.targetLanguage} • {settings.stylePreset}</p>
            <button onClick={onStart} className="w-full bg-accent text-white font-medium py-3 rounded-xl mb-3">Mulai Latihan</button>
            <button onClick={onSettings} className="text-sm text-ink-muted">Ubah Pengaturan</button>
          </div>
        </div>
      );
    }

    // --- LESSON (KUIS UI) ---
    function Lesson({ settings, onBack }) {
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [exercises, setExercises] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      
      // State buat jawaban user
      const [typedAnswer, setTypedAnswer] = useState('');
      const [selectedOption, setSelectedOption] = useState(null);
      const [isAnswered, setIsAnswered] = useState(false);
      const [isCorrect, setIsCorrect] = useState(false);

      const fetchExercises = async () => {
        setLoading(true); setError('');
        try {
          const prompt = generatePrompt(settings);
          const result = await fetchWithFallback(prompt, settings.apiKey);
          setExercises(result);
          setCurrentIndex(0);
        } catch (err) { setError(err.message); } 
        finally { setLoading(false); }
      };

      const playAudio = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = settings.targetLanguage === 'English' ? 'en-US' : 'ja-JP'; // fallback aja
          window.speechSynthesis.speak(utterance);
        } else {
          alert("Browser lu ga support TTS (Text-to-Speech)");
        }
      };

      const handleCheck = () => {
        const currentQ = exercises[currentIndex];
        let userAns = currentQ.options ? selectedOption : typedAnswer;
        
        if (!userAns) return; // Jangan submit kalau kosong

        const isMatch = userAns.trim().toLowerCase() === currentQ.correctAnswer.trim().toLowerCase();
        setIsCorrect(isMatch);
        setIsAnswered(true);
      };

      const handleNext = () => {
        if (currentIndex < exercises.length - 1) {
          setCurrentIndex(prev => prev + 1);
          setTypedAnswer(''); setSelectedOption(null); setIsAnswered(false); setIsCorrect(false);
        } else {
          // Kalau udah soal terakhir, balik ke Home
          alert("Mantap! Latihan selesai.");
          onBack();
        }
      };

      // --- RENDER SOAL BERDASARKAN TIPE ---
      const renderExercise = () => {
        const q = exercises[currentIndex];
        
        // Header (Progress bar)
        const progress = ((currentIndex) / exercises.length) * 100;

        return (
          <div className="w-full max-w-lg mx-auto">
            {/* Progress Bar */}
            <div className="w-full bg-border rounded-full h-2 mb-6">
              <div className="bg-accent h-2 rounded-full transition-all" style={{ width: `${progress}%` }}></div>
            </div>

            <div className="mb-8">
              <p className="text-sm font-bold text-accent mb-2 uppercase tracking-wide">{q.type.replace('-', ' ')}</p>
              
              {/* Teks Soal */}
              {q.type === 'listening' ? (
                <button onClick={() => playAudio(q.audioText)} className="w-20 h-20 bg-accent text-white rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg hover:bg-blue-600">
                  <SpeakerIcon />
                </button>
              ) : (
                <h2 className="text-xl sm:text-2xl font-bold text-ink leading-tight">
                  {q.question}
                </h2>
              )}
              
              {q.prompt && <p className="text-ink-muted mt-2 text-sm">{q.prompt}</p>}
            </div>

            {/* Input Area */}
            <div className="space-y-3">
              {/* Jika ada opsi (MCQ) */}
              {q.options && q.options.map((opt, i) => (
                <button 
                  key={i} 
                  onClick={() => !isAnswered && setSelectedOption(opt)}
                  disabled={isAnswered}
                  className={`w-full text-left px-4 py-3 rounded-xl border-2 transition-all font-medium ${
                    isAnswered && opt === q.correctAnswer ? 'border-success bg-green-50 text-success' :
                    isAnswered && opt === selectedOption && !isCorrect ? 'border-error bg-red-50 text-error' :
                    selectedOption === opt ? 'border-accent bg-accent-soft text-accent' : 
                    'border-border bg-white text-ink hover:bg-surface-alt'
                  }`}
                >
                  {opt}
                </button>
              ))}

              {/* Jika Tipe Translate / Fill Blank (Input Teks) */}
              {!q.options && (
                <input 
                  type="text" 
                  value={typedAnswer} 
                  onChange={e => setTypedAnswer(e.target.value)}
                  disabled={isAnswered}
                  placeholder="Ketik jawabanmu di sini..."
                  className={`w-full px-4 py-3 rounded-xl border-2 text-lg outline-none transition-all ${
                    isAnswered && isCorrect ? 'border-success bg-green-50' :
                    isAnswered && !isCorrect ? 'border-error bg-red-50' :
                    'border-border focus:border-accent'
                  }`}
                  onKeyDown={(e) => { if(e.key === 'Enter') handleCheck(); }}
                />
              )}
            </div>

            {/* Footer / Feedback */}
            {isAnswered && (
              <div className={`mt-6 p-4 rounded-xl border ${isCorrect ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`}>
                <p className={`font-bold mb-1 ${isCorrect ? 'text-success' : 'text-error'}`}>
                  {isCorrect ? '✅ Benar!' : '❌ Salah, jawaban yang bener:'}
                </p>
                {!isCorrect && <p className="font-medium mb-2">{q.correctAnswer}</p>}
                <p className="text-sm text-ink-muted">{q.explanation}</p>
              </div>
            )}

            {/* Tombol Action */}
            <div className="mt-8">
              {!isAnswered ? (
                <button 
                  onClick={handleCheck} 
                  disabled={!typedAnswer && !selectedOption}
                  className="w-full bg-accent text-white font-bold py-3.5 rounded-xl disabled:opacity-50"
                >
                  Cek Jawaban
                </button>
              ) : (
                <button 
                  onClick={handleNext} 
                  className="w-full bg-accent text-white font-bold py-3.5 rounded-xl"
                >
                  {currentIndex === exercises.length - 1 ? 'Selesai' : 'Lanjut Soal Berikutnya'}
                </button>
              )}
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen p-4 pt-6 bg-surface-alt flex flex-col">
          <button onClick={onBack} className="text-sm font-medium text-ink-muted mb-4 self-start">&larr; Keluar</button>
          
          <div className="flex-1 flex flex-col justify-center pb-12">
            {!exercises.length && !loading && (
              <div className="text-center">
                <button onClick={fetchExercises} className="bg-accent text-white px-6 py-3 rounded-xl font-bold shadow-md">
                  Generate 5 Soal Sekarang
                </button>
              </div>
            )}

            {loading && <p className="text-center font-medium text-accent animate-pulse">Menyiapkan soal dari AI...</p>}
            
            {error && <div className="text-center bg-red-50 text-red-600 p-4 rounded-xl">{error}</div>}

            {exercises.length > 0 && renderExercise()}
          </div>
        </div>
      );
    }

    // --- APP ---
    function App() {
      const [view, setView] = useState('loading');
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);

      useEffect(() => {
        const loaded = loadSettings();
        setSettings(loaded);
        setView(loaded.apiKey ? 'home' : 'onboarding');
      }, []);

      const handleSaveSettings = () => { setSettings(loadSettings()); setView('home'); };

      if (view === 'loading') return null;
      if (view === 'onboarding') return <Onboarding onSave={handleSaveSettings} />;
      if (view === 'settings') return <Onboarding onSave={() => setView('home')} />;
      if (view === 'home') return <Home settings={settings} onStart={() => setView('lesson')} onSettings={() => setView('settings')} />;
      if (view === 'lesson') return <Lesson settings={settings} onBack={() => setView('home')} />;
      
      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
