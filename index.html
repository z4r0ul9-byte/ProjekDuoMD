<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaQuest</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: '#4d6bfe',
            'accent-soft': '#eef1ff',
            ink: '#0d0d0d',
            'ink-muted': '#6b7280',
            surface: '#ffffff',
            'surface-alt': '#fafafa',
            border: '#e5e5e5',
          }
        }
      }
    }
  </script>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background-color: #fafafa; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .lq-fade-in { animation: fadeIn 220ms ease-out both; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- STORAGE ---
    const DEFAULT_SETTINGS = {
      apiKey: '',
      targetLanguage: 'English',
      stylePreset: 'santuy',
      customStylePrompt: '',
      level: 'beginner',
    };

    const loadSettings = () => {
      try {
        const raw = localStorage.getItem('linguaquest.settings');
        return raw ? { ...DEFAULT_SETTINGS, ...JSON.parse(raw) } : DEFAULT_SETTINGS;
      } catch { return DEFAULT_SETTINGS; }
    };

    const saveSettings = (settings) => {
      localStorage.setItem('linguaquest.settings', JSON.stringify(settings));
    };

    // --- ICONS ---
    const Sparkles = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
      </svg>
    );

    // --- PROMPT GENERATOR ---
    const getStyleText = (settings) => {
      if (settings.stylePreset === 'gaul') return 'Gunakan bahasa gaul Jakarta yang santai, banyak slang (kayak, gue, lo, wkwk).';
      if (settings.stylePreset === 'formal') return 'Gunakan bahasa Indonesia formal, baku, dan sopan.';
      if (settings.stylePreset === 'storyteller') return 'Gunakan gaya bercerita yang menarik dan imajinatif.';
      if (settings.stylePreset === 'custom') return settings.customStylePrompt || 'Gunakan bahasa yang santai dan mudah dimengerti.';
      return 'Gunakan bahasa Indonesia sehari-hari yang santuy dan asik.';
    };

    const generatePrompt = (settings) => {
      return `Kamu adalah guru bahasa ${settings.targetLanguage} untuk orang Indonesia.
Buatkan 5 soal latihan (campuran translate, fill-in-the-blank, dan grammar) untuk level ${settings.level}.
Gaya bahasa kamu saat memberikan penjelasan harus: ${getStyleText(settings)}.

Output HARUS berupa JSON array murni tanpa markdown, dengan format persis seperti ini:
[
  {
    "type": "translate",
    "question": "Saya suka makan apel",
    "prompt": "Translate to ${settings.targetLanguage}",
    "correctAnswer": "I like eating apples",
    "explanation": "Penjelasan kenapa jawabannya itu..."
  },
  {
    "type": "grammar",
    "question": "Which one is correct?",
    "options": ["He go to school", "He goes to school", "He going to school", "He gone to school"],
    "correctAnswer": "He goes to school",
    "explanation": "Penjelasan singkat..."
  }
]`;
    };

    // --- GEMINI API FETCH WITH FALLBACK ---
    // Daftar model dari yang paling pinter ke yang paling stabil
    const FALLBACK_MODELS = [
      'gemini-3.8-flash',
      'gemini-3.6-flash',
      'gemini-flash-latest'
    ];

    const fetchWithFallback = async (prompt, apiKey) => {
      let lastError = null;
      
      for (const model of FALLBACK_MODELS) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ role: "user", parts: [{ text: prompt }] }],
              generationConfig: { responseMimeType: "application/json" }
            })
          });

          if (res.ok) {
            const json = await res.json();
            const rawText = json.candidates[0].content.parts[0].text;
            return JSON.parse(rawText); // Sukses, kembalikan data
          } else {
            const errData = await res.json();
            lastError = new Error(errData.error?.message || `Gagal di ${model}`);
            console.warn(`Model ${model} gagal: ${lastError.message}. Mencoba fallback...`);
            // Lanjut ke model berikutnya di loop
          }
        } catch (err) {
          lastError = err;
          console.warn(`Network error di ${model}: ${err.message}. Mencoba fallback...`);
        }
      }
      
      // Kalau semua model di daftar udah dicoba dan gagal semua
      throw new Error(`Semua model sedang sibuk. Error terakhir: ${lastError?.message}`);
    };

    // --- COMPONENTS ---
    function Onboarding({ onSave }) {
      const [form, setForm] = useState(loadSettings());

      const handleSubmit = (e) => {
        e.preventDefault();
        saveSettings(form);
        onSave();
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="lq-fade-in max-w-md w-full bg-surface rounded-2xl border border-border shadow-sm p-6 sm:p-8">
            <div className="text-center mb-6">
              <div className="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-accent-soft text-accent mb-3">
                <Sparkles size={24} />
              </div>
              <h1 className="text-2xl font-bold text-ink">Selamat Datang</h1>
              <p className="text-sm text-ink-muted mt-1">Atur preferensi belajarmu dulu</p>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-sm font-medium text-ink mb-1">Gemini API Key</label>
                <input type="password" required placeholder="AIzaSy..." value={form.apiKey} onChange={e => setForm({...form, apiKey: e.target.value})} className="w-full px-3 py-2 border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-accent text-sm" />
                <p className="text-xs text-ink-muted mt-1">Dapetin gratis di aistudio.google.com</p>
              </div>
              
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-sm font-medium text-ink mb-1">Bahasa Target</label>
                  <select value={form.targetLanguage} onChange={e => setForm({...form, targetLanguage: e.target.value})} className="w-full px-3 py-2 border border-border rounded-lg bg-white text-sm focus:outline-none focus:ring-2 focus:ring-accent">
                    <option>English</option>
                    <option>Japanese</option>
                    <option>Korean</option>
                    <option>Arabic</option>
                    <option>Spanish</option>
                  </select>
                </div>
                <div>
                  <label className="block text-sm font-medium text-ink mb-1">Level</label>
                  <select value={form.level} onChange={e => setForm({...form, level: e.target.value})} className="w-full px-3 py-2 border border-border rounded-lg bg-white text-sm focus:outline-none focus:ring-2 focus:ring-accent">
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                  </select>
                </div>
              </div>

              <div>
                <label className="block text-sm font-medium text-ink mb-1">Gaya Mengajar AI</label>
                <select value={form.stylePreset} onChange={e => setForm({...form, stylePreset: e.target.value})} className="w-full px-3 py-2 border border-border rounded-lg bg-white text-sm focus:outline-none focus:ring-2 focus:ring-accent">
                  <option value="santuy">Santuy & Asik</option>
                  <option value="gaul">Gaul Jakarta (Slang)</option>
                  <option value="formal">Formal & Baku</option>
                  <option value="storyteller">Storyteller (Bercerita)</option>
                  <option value="custom">Custom...</option>
                </select>
              </div>

              {form.stylePreset === 'custom' && (
                <div>
                  <label className="block text-sm font-medium text-ink mb-1">Custom Gaya</label>
                  <input type="text" placeholder="Misal: Bikin penjelasannya pake pantun" value={form.customStylePrompt} onChange={e => setForm({...form, customStylePrompt: e.target.value})} className="w-full px-3 py-2 border border-border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-accent" />
                </div>
              )}

              <button type="submit" className="w-full bg-accent hover:bg-blue-600 text-white font-medium py-2.5 rounded-lg transition-colors mt-2">
                Simpan & Mulai
              </button>
            </form>
          </div>
        </div>
      );
    }

    function Home({ onStart, onSettings, settings }) {
      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="lq-fade-in max-w-md w-full bg-surface rounded-2xl border border-border shadow-sm p-8 text-center">
            <h1 className="text-2xl font-bold text-ink mb-2">Siap Belajar?</h1>
            <p className="text-ink-muted mb-6 text-sm">Bahasa: <span className="font-semibold text-ink">{settings.targetLanguage}</span> • Gaya: <span className="font-semibold text-ink capitalize">{settings.stylePreset}</span></p>
            
            <button onClick={onStart} className="w-full bg-accent hover:bg-blue-600 text-white font-medium py-3 rounded-xl transition-colors mb-3 shadow-sm">
              Mulai Latihan
            </button>
            <button onClick={onSettings} className="text-sm text-ink-muted hover:text-ink">Ubah Pengaturan</button>
          </div>
        </div>
      );
    }

    function Lesson({ settings, onBack }) {
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [data, setData] = useState(null);

      const fetchExercises = async () => {
        setLoading(true);
        setError('');
        try {
          const prompt = generatePrompt(settings);
          const result = await fetchWithFallback(prompt, settings.apiKey);
          setData(result);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen p-4 pt-8 bg-surface-alt">
          <div className="max-w-2xl mx-auto">
            <button onClick={onBack} className="text-sm text-ink-muted mb-4 inline-block">&larr; Kembali</button>
            
            <div className="bg-surface rounded-2xl border border-border p-6 shadow-sm min-h-[300px]">
              <h2 className="text-lg font-bold mb-4">Phase 2: Uji Gemini</h2>
              
              {!data && !loading && (
                <button onClick={fetchExercises} className="bg-accent text-white px-4 py-2 rounded-lg text-sm font-medium">
                  Generate 5 Soal Sekarang
                </button>
              )}

              {loading && <p className="text-accent animate-pulse text-sm">Menghubungi Gemini... (Mencari server yang siap)</p>}
              
              {error && (
                <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm border border-red-200">
                  <strong>Error:</strong> {error}
                  <br/><br/>
                  Kalau ini terus muncul, coba lagi beberapa saat atau pastikan kuota free tier kamu masih ada.
                </div>
              )}

              {data && (
                <div className="bg-black text-green-400 p-4 rounded-xl text-xs overflow-auto max-h-96">
                  <pre>{JSON.stringify(data, null, 2)}</pre>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- APP ---
    function App() {
      const [view, setView] = useState('loading');
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);

      useEffect(() => {
        const loaded = loadSettings();
        setSettings(loaded);
        setView(loaded.apiKey ? 'home' : 'onboarding');
      }, []);

      const handleSaveSettings = () => {
        setSettings(loadSettings());
        setView('home');
      };

      if (view === 'loading') return null;
      if (view === 'onboarding') return <Onboarding onSave={handleSaveSettings} />;
      if (view === 'settings') return <Onboarding onSave={() => setView('home')} />;
      if (view === 'home') return <Home settings={settings} onStart={() => setView('lesson')} onSettings={() => setView('settings')} />;
      if (view === 'lesson') return <Lesson settings={settings} onBack={() => setView('home')} />;
      
      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
